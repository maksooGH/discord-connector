[project]
name = "discord-connector"
version = "0.1.0"
description = "Capture a Discord server into SQLite, then query it offline."
requires-python = ">=3.9"
dependencies = [
    "discord.py>=2.7.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
sheets = ["google-api-python-client>=2.100.0", "google-auth>=2.23.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]
